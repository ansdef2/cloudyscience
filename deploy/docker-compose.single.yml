# Развёртывание на одном облачном сервере: база данных тоже в контейнере.
# Дешевле варианта с управляемой БД — платите только за сервер.
# Взамен бэкапы и обновления PostgreSQL на вас (см. DEPLOY_TIMEWEB.md).
#
# Запуск:  docker compose -f deploy/docker-compose.single.yml --env-file deploy/.env up -d --build

# Логи контейнеров не разрастаются: до 5 файлов по 10 МБ на сервис
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    container_name: cloudco-caddy
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?укажите DOMAIN в deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  postgres:
    image: postgres:15-alpine
    container_name: cloudco-postgres
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${DB_NAME:-cloudco}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD в deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: cloudco-backend
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      NODE_ENV: production
      PORT: 3001

      # База в соседнем контейнере: адрес — имя сервиса, шифрование не нужно
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cloudco}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: "false"

      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET в deploy/.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${PUBLIC_URL:?укажите PUBLIC_URL в deploy/.env}
      # Адрес сайта — для ссылок в письмах (сброс пароля, согласие родителя)
      PUBLIC_URL: ${PUBLIC_URL}

      # Почта для писем. Без SMTP_HOST письма не уходят, ссылки выдаёт администратор
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Куда слать администратору письма о новых бронях, заявках и жалобах
      ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL:-}

      # Загруженные файлы (к броням, аватары, картинки) — в томе uploads
      UPLOAD_DIR: /app/uploads

      # Сид пересоздаёт схему и стирает данные — запускается вручную
      SEED_ON_START: "false"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:?укажите PUBLIC_URL в deploy/.env}/api
        # Номер счётчика Яндекс Метрики; не задан — статистики нет
        NEXT_PUBLIC_YM_ID: ${YM_ID:-}
    container_name: cloudco-frontend
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  uploads:
